
name: Publish Module to PowerShell Gallery

on:
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/pester.yml

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Installs dependencies
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module psPAS, CredentialRetriever, Microsoft.PowerShell.SecretManagement -Force
          Import-Module psPAS, CredentialRetriever, Microsoft.PowerShell.SecretManagement -Force
      - name: Publish Module to PowerShell Gallery
        uses: pcgeek86/publish-powershell-module-action@7c0bb5c0041e699d64298cf22b1e27e5cf9a5f73 # v20
        id: publish-module
        with:
          modulePath: SecretManagement.CyberArk
          NuGetApiKey: ${{ secrets.PS_GALLERY_KEY }}
