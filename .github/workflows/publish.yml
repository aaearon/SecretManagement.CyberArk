
name: Publish Module to PowerShell Gallery

on:
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/pester.yml

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Installs dependencies
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module psPAS, CredentialRetriever, Microsoft.PowerShell.SecretManagement -Force
          Import-Module psPAS, CredentialRetriever, Microsoft.PowerShell.SecretManagement -Force
      - name: Publish Module to PowerShell Gallery
        shell: pwsh
        env:
          PS_GALLERY_KEY: ${{ secrets.PS_GALLERY_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          Publish-Module -Path SecretManagement.CyberArk -NuGetApiKey $env:PS_GALLERY_KEY
